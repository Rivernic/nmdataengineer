    <style>
        @font-face {
            font-family: 'Outfit'; font-style: normal; font-weight: 300; font-display: swap;
            src: url('fonts/outfit-300.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Outfit'; font-style: normal; font-weight: 700; font-display: swap;
            src: url('fonts/outfit-700.woff2') format('woff2');
        }
        @font-face {
            font-family: 'JetBrains Mono'; font-style: normal; font-weight: 700; font-display: swap;
            src: url('fonts/jetbrainsmono-700.woff2') format('woff2');
        }
    </style>

    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Crect%20width=%22100%22%20height=%22100%22%20rx=%2220%22%20fill=%22%23050505%22%20stroke=%22%23e31c3e%22%20stroke-width=%224%22/%3E%3Ctext%20x=%2250%22%20y=%2250%22%20font-family=%22%27JetBrains%20Mono%27%22%20font-weight=%22bold%22%20font-size=%2245%22%20fill=%22%23ffffff%22%20text-anchor=%22middle%22%20dy=%22.3em%22%3EN%3Ctspan%20fill=%22%23e31c3e%22%3EM%3C/tspan%3E%3C/text%3E%3C/svg%3E">

    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #e31c3e;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1; opacity: 0.3;
        }
        .logo { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.5rem; letter-spacing: -1px; margin-bottom: 60px; }
        .logo span { color: var(--accent); }
        .code {
            font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 6rem; line-height: 1;
            color: var(--accent); text-shadow: 0 0 40px rgba(227, 28, 62, 0.4);
        }
        h1 { font-size: 1.8rem; font-weight: 700; margin: 20px 0 10px; }
        p { color: var(--text-muted); font-size: 1rem; max-width: 420px; margin-bottom: 40px; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
        .btn-primary {
            display: inline-block; background-color: var(--accent); color: white;
            padding: 16px 40px; border-radius: 50px; text-decoration: none; font-weight: 600;
            font-size: 1rem; transition: all 0.3s ease; box-shadow: 0 0 25px rgba(227, 28, 62, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(227, 28, 62, 0.6); }
    </style>
</head>
<body>
    <div class="logo">NM<span>_DATA</span></div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>This page doesn't exist — but your next batch of verified leads still can. Head back home to get started.</p>
    <a href="/" class="btn-primary">Back to Home</a>
</body>
</html>
